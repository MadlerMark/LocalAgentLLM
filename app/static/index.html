<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Local Agent LLM</title>
  <style>
    :root {
      --bg: #0a1117;
      --panel: #111c24;
      --panel-2: #152532;
      --text: #e6f2ff;
      --muted: #8cb0c9;
      --accent: #29d3a3;
      --danger: #ff6f6f;
      --ring: rgba(41, 211, 163, 0.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      color: var(--text);
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 15%, #12364a 0%, transparent 35%),
        radial-gradient(circle at 85% 80%, #0f5a45 0%, transparent 25%),
        linear-gradient(140deg, #0a1117, #0e1b25 55%, #0b141c);
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .app {
      width: min(980px, 100%);
      height: min(88vh, 920px);
      border: 1px solid #1f3647;
      border-radius: 14px;
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.35);
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
    }
    header {
      padding: 16px 20px;
      border-bottom: 1px solid #224055;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .title { font-size: 1rem; letter-spacing: 0.08em; text-transform: uppercase; }
    .meta { color: var(--muted); font-size: 0.85rem; }
    #chat {
      overflow: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 86%;
      padding: 10px 12px;
      border-radius: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
      animation: rise 180ms ease;
    }
    .user { align-self: flex-end; background: #1f6d5a; }
    .agent { align-self: flex-start; background: #1a2f3f; }
    .error { align-self: flex-start; background: #4b1f2a; border: 1px solid #7e2f43; }
    form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      padding: 14px;
      border-top: 1px solid #224055;
      background: rgba(7, 15, 21, 0.45);
    }
    input {
      background: #08131b;
      border: 1px solid #27475f;
      color: var(--text);
      border-radius: 10px;
      padding: 12px;
      font-size: 0.98rem;
      outline: none;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
    button {
      background: var(--accent);
      color: #052217;
      border: none;
      border-radius: 10px;
      padding: 0 16px;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: 0.65; cursor: wait; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 760px) {
      .app { height: 94vh; }
      .msg { max-width: 95%; }
      .title { font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="title">Local Agent LLM</div>
      <div class="meta" id="meta">Ready</div>
    </header>
    <section id="chat"></section>
    <form id="form">
      <input id="input" autocomplete="off" placeholder="Ask coding task..." required />
      <button id="send" type="submit">Send</button>
    </form>
  </main>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const meta = document.getElementById("meta");
    const history = [];

    function append(role, text, cls = "") {
      const div = document.createElement("div");
      div.className = `msg ${role} ${cls}`.trim();
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      append("user", message);
      history.push({ role: "user", content: message });
      input.value = "";
      send.disabled = true;
      meta.textContent = "Thinking...";

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, history })
        });
        const raw = await res.text();
        let data;
        try {
          data = raw ? JSON.parse(raw) : {};
        } catch {
          data = { detail: raw || `HTTP ${res.status}` };
        }
        if (!res.ok) throw new Error(data.detail || data.answer || `HTTP ${res.status}`);

        append("agent", data.answer || "(empty response)");
        history.push({ role: "assistant", content: data.answer || "" });
        meta.textContent = `${data.latency_ms}ms | ${data.iterations} step(s)`;
      } catch (err) {
        append("agent", String(err), "error");
        meta.textContent = "Error";
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
